on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish"
        required: true
  release:
    types: [published, released, created]

name: React Release

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mysql, mysqlnd, sqlite3, bcmath, gd, curl, zip, openssl, mbstring, xml

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v5-develop
          fetch-depth: 1

      - name: Install composer dependencies
        env:
          COMPOSER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${COMPOSER_GITHUB_TOKEN:-}" ]; then
            composer config -g github-oauth.github.com "${COMPOSER_GITHUB_TOKEN}"
          fi
          composer install --no-dev

      - name: Set current date to variable
        id: set_date
        run: echo "current_date=$(date '+%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Prepare React FrontEnd
        env:
          GITEA_TOKEN: ${{ secrets.LOCAL_REGISTRY_TOKEN }}
        run: |
          git clone "https://kaprii:${GITEA_TOKEN}@gitea.taila64eb.ts.net/kaprii/ui.git"
          cd ui
          git checkout develop
          sed -i 's/VITE_IS_TEST=true/VITE_IS_TEST=false/' .env.example
          echo VITE_PUSHER_APP_KEY=f0111a02782708da651f >> .env.example

          cp .env.example .env
          cp ../vite.config.ts.react ./vite.config.js
          sed -i '/"version"/c\  "version": " Latest Build - ${{ env.current_date }}",' package.json
          npm i
          npm run build
          cp -r dist/* ../public/
          mv ../public/index.html ../resources/views/react/index.blade.php

      - name: Prepare JS/CSS assets
        run: |
          npm i
          npm run production

      - name: Cleanup Builds
        run: |
          rm -rf node_modules
          rm -rf .git
          rm .env || true
          rm -rf ui || true
          # Set permissions: directories 755, files 644
          chmod -R a=r,u+w,a+X .

      - name: Build project
        run: |
          shopt -s dotglob
          tar --exclude='public/storage' --exclude='invoiceninja.zip' -zcvf /home/runner/work/invoiceninja/invoiceninja.tar ./*
          cd ../
          tar --exclude='public/storage' --exclude='invoiceninja.zip' -zcvf invoiceninja.tar.gz invoiceninja/
      - name: Create or update Gitea release assets
        env:
          GITEA_TOKEN: ${{ secrets.LOCAL_REGISTRY_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.TAG_NAME;
          if (!tag) {
            throw new Error('TAG_NAME is required');
          }
          fs.writeFileSync('release-payload.json', JSON.stringify({
            tag_name: tag,
            name: tag,
            body: `Release ${tag}\n`,
            draft: false,
            prerelease: false,
          }));
          NODE

          release_json="$(mktemp)"
          status=$(curl -sS -o "$release_json" -w "%{http_code}" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${SERVER_URL}/api/v1/repos/${REPOSITORY}/releases/tags/${TAG_NAME}")
          if [ "$status" = "404" ]; then
            curl -fsSL \
              -X POST \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @release-payload.json \
              "${SERVER_URL}/api/v1/repos/${REPOSITORY}/releases" > "$release_json"
          elif [ "$status" -ge 400 ]; then
            cat "$release_json"
            exit 1
          fi

          release_id="$(node -e "const fs=require('node:fs'); console.log(JSON.parse(fs.readFileSync(process.argv[1], 'utf8')).id)" "$release_json")"
          for asset in /home/runner/work/invoiceninja/invoiceninja.tar /home/runner/work/invoiceninja/invoiceninja.tar.gz; do
            name="$(basename "$asset")"
            asset_id="$(node -e "const fs=require('node:fs'); const rel=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); const asset=(rel.assets || []).find((item) => item.name === process.argv[2]); console.log(asset ? asset.id : '')" "$release_json" "$name")"
            if [ -n "$asset_id" ]; then
              curl -fsSL \
                -X DELETE \
                -H "Authorization: token ${GITEA_TOKEN}" \
                "${SERVER_URL}/api/v1/repos/${REPOSITORY}/releases/${release_id}/assets/${asset_id}"
            fi
            curl -fsSL \
              -X POST \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -F "attachment=@${asset}" \
              "${SERVER_URL}/api/v1/repos/${REPOSITORY}/releases/${release_id}/assets?name=${name}"
          done
